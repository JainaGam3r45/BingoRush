# Vanilla sound keys played at each moment. An empty value plays nothing;
# a key that does not exist is reported at load and then ignored.
sounds:
  claim: entity.experience_orb.pickup
  win: ui.toast.challenge_complete
  countdown: block.note_block.pling
  start: block.beacon.activate
  lockout-lost: block.note_block.bass
  # Menus: clicks in the lobby menus and the chime for joining a team.
  menu-click: ui.button.click
  team-chime: block.note_block.chime

# Update notifications from the GitHub repository.
# Checks run asynchronously in the background so they never slow down the server.
update-notifier:
  enabled: true
  on-join: true
  # Hours between automatic background checks while the server runs. 0 disables the timer.
  check-interval-hours: 24

# Match history and logs.
# Completed matches are saved asynchronously to data/matches/ as JSON files.
history:
  # Set to false to disable saving match results and in-game match history.
  enabled: true
  # Maximum number of match files to keep in data/matches/.
  # The oldest matches are deleted when new ones finish. 0 disables the limit.
  max-saved-matches: 50

# Seasonal event settings.
# Automated schedule runs in UTC. When enabled, visual and festive effects
# trigger according to the current season phase.
season:
  enabled: true
  # Scheduled dates in UTC (ISO-8601).
  pre-season-start: "2026-11-25T00:00:00Z"
  active-start: "2026-12-01T00:00:00Z"
  active-end: "2026-12-31T23:59:59Z"
  wrap-up-end: "2027-01-03T23:59:59Z"
  # Visual effects during active season.
  snowfall: true
  claim-firework: true
  lobby-snow: false
  # Radius in blocks around lobby spawn for seasonal visual changes (0 disables).
  lobby-radius: 25
  # Seasonal gift hunt in lobbies ("The Search" style hidden presents).
  gifts:
    enabled: true
    # Automatically spawn gifts around the lobby location when the season is active.
    auto-spawn: true
    # Number of gifts to spawn automatically if no fixed locations are defined.
    auto-spawn-count: 5
    # Detection radius in blocks for particle and sound proximity cues.
    proximity-radius: 8.0
    # Action bar and on-screen title clues when nearby or claiming a gift.
    actionbar-clue: true
    title-clue: true
    # Different types of gifts with custom skull textures, particles, sounds and rewards.
    types:
      red_gift:
        name: "<red>Red Gift</red>"
        texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNmNlMDRjMTZhNjk1ZmYxMTk2NDFmNDdiZjYyOGE1NTYzOWZmMzIyOWIzNWZhNTJlNDI4Y2RiMWE2ZDk2MjA1ZSJ9fX0="
