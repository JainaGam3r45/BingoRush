# BingoRush configuration.
# Values the plugin reads are checked when it loads this file; mistakes are
# printed to the console, one line each, naming the key to fix.

# Language of every message players read, from lang/messages_<language>.yml.
# "en" and "es" ship with the plugin. To add one, copy messages_en.yml to
# messages_<code>.yml, translate it and put the code here.
language: en

# Game mode: "items" for classic item collection, "advancements" for vanilla
# advancement hunt.
game-mode: items

# How a round is won: "full" fills the whole card, "line" completes one row,
# column or diagonal.
win-mode: full

# Lockout mode: cells are exclusive. The first team to claim a cell locks it
# forever, preventing rivals from claiming it.
lockout: false

# Lives per player during a round. A player who uses them all watches the
# rest as a spectator, and a team with nobody left is out. When only one team
# is still standing it wins; if every team is out, the most cells wins.
# 0 means unlimited lives, 1 is hardcore.
lives: 0

# What chat shows when a player in a round dies or gets an advancement.
# "custom" uses the templates in the language file, "vanilla" keeps Minecraft's
# own line and "hidden" removes it. Players outside the round are left alone.
round-chat:
  deaths: custom
  advancements: custom

# Show the round card as its own tab in the advancements screen (L). Each
# player sees the cells their team already has marked as done.
# Adding the tab makes the server reload every player's advancements, so the
# plugin saves all players first; Paper logs a warning about a manual save
# when that happens, once per round.
advancement-tab: true

# Lobby location where players wait before a round and return when it ends.
# Use /bingo setlobby in game to configure this automatically.
lobby:
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# Available game maps for signs and /bingo randomjoin.
# Each map can have a fixed seed or "random" for survival world seeds.
maps:
  partida-1:
    name: "Partida 1"
    seed: "random"
    mode: items
    time-limit: 1800
  partida-2:
    name: "Partida 2"
    seed: "random"
    mode: items
    time-limit: 1800

# Round time limit in seconds. When it runs out, the team with the most
# claimed cells wins and an earlier last claim breaks a tie. 0 means no
# clock: the round runs until a team completes the card.
time-limit: 1800

# Seconds between /bingo start and the round itself. 0 starts right away.
countdown: 10

# Players per team. 1 plays solo.
team-size: 2

# Empty every inventory when the round starts and give the contents back when
# it ends. Stops players from bringing a pre-filled backpack.
clear-inventories: true

# Spread team members around the world spawn when the round starts, so
# nobody spawns on top of the chests.
scatter-players: true
scatter-radius: 24

# What a player who joins after the round started gets. "join" puts them in a
# team like everyone else, with their inventory emptied. "spectate" makes them
# a spectator until the round ends, when their game mode comes back. Players
# with bingo.admin are never forced, and players already online without a
# team are left alone. Anyone without a team can use /bingo spectate.
late-join: join

# Teams for the event. Each one has a name and a color, and players join with
# /bingo join, /bingo join <team> or the /bingo teams menu. With no teams
# here, the plugin invents one per group as players join. Teams added at
# runtime with /bingo teams add last until the server restarts.
teams:
  - name: Red
    color: "#FF5555"
  - name: Blue
    color: "#5555FF"
  - name: Green
    color: "#55FF55"
  - name: Yellow
    color: "#FFFF55"

# The 25 cells of the card come from these tiers. Each tier lists the items
# it can draw from and how many cells it fills; the cells must add up to 25.
# Item keys are namespaced, plain names mean minecraft:. The plugin checks
# every key against the item registry when it loads this file and prints one
# console error per entry that does not exist.
