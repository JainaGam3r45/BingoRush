# What each arena setting takes, shown when a value is wrong.
arena-option:
  name: "<prefix><err><errval><value></errval><err> can't be a name. Use 1 to 32 characters."
  seed: "<prefix><err>That seed is too long. Use a number, up to 64 characters of text, or <hl>random</hl>."
  mode: "<prefix><err><errval><value></errval><err> isn't a mode. Use <hl>items</hl> or <hl>advancements</hl>."
  win-mode: "<prefix><err><errval><value></errval><err> isn't a win condition. Use <hl>line</hl> or <hl>full</hl>."
  lockout: "<prefix><err><errval><value></errval><err> isn't on or off. Use <hl>true</hl> or <hl>false</hl>."
  time-limit: "<prefix><err><errval><value></errval><err> isn't a time limit. Use seconds, or <hl>30m</hl> and <hl>1h</hl>, up to 24 hours. <hl>0</hl> means no limit."
  team-size: "<prefix><err><errval><value></errval><err> isn't a team size. Use a number from <hl>1</hl> to <hl>16</hl>."
  max-teams: "<prefix><err><errval><value></errval><err> isn't a number of teams. Use <hl>2</hl> to <hl>32</hl>."
  countdown: "<prefix><err><errval><value></errval><err> isn't a countdown. Use <hl>0</hl> to <hl>300</hl> seconds."
  lives: "<prefix><err><errval><value></errval><err> isn't a number of lives. Use <hl>0</hl> to <hl>100</hl>: 0 is unlimited, 1 is hardcore."
  border: "<prefix><err><errval><value></errval><err> isn't a border. Use <hl>0</hl> for none, or <hl>64</hl> to <hl>100000</hl> blocks across."
  pvp: "<prefix><err><errval><value></errval><err> isn't on or off. Use <hl>true</hl> or <hl>false</hl>."
  keep-inventory: "<prefix><err><errval><value></errval><err> isn't on or off. Use <hl>true</hl> or <hl>false</hl>."
  daylight: "<prefix><err><errval><value></errval><err> isn't a time of day. Use <hl>cycle</hl>, <hl>day</hl> or <hl>night</hl>."

