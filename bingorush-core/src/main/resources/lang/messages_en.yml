# Chat lines for players in a round, used when round-chat in config.yml is
# "custom". <message> is Minecraft's own death line, shown in each player's
# language. <advancement> is the advancement name with its usual hover text.
death-message: "<prefix><muted>☠</muted> <body><message>"
death-message-lives: "<prefix><muted>☠</muted> <body><message> <muted>(lives: <hl><lives></hl><muted>)"
death-message-eliminated: "<prefix><err>☠</err> <body><message> <muted>· <err>out of lives, now spectating</err>"
advancement-message: "<prefix><hl><player></hl> <muted>(<team><muted>)</muted> <body>has made the advancement <advancement>"
# The round card in the advancements screen (L). <detail> is the advancement
# description in advancement rounds and card-tab-cell-item in item rounds.
card-tab-title: "<brand>"
card-tab-description: "<body>Your team's card for this round.<br><muted>Seed <seed>"
card-tab-cell-title: "<hl>#<number></hl> <white><item>"
card-tab-cell-description: "<body><detail><br><muted>Row <row>, column <column>"
card-tab-cell-item: "Have it in your inventory to mark it."

