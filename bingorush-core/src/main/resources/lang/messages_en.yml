# Arenas from commands and the editor. Every error says how to fix it.
arena:
  not-found: "<prefix><err>There's no arena called <errval><arena></errval><err>. See them with <hl>/bingo arena list</hl>."
  invalid-id: "<prefix><err><errval><value></errval><err> can't be an arena id. Use 1 to 32 characters from a-z, 0-9, _ and -, like <hl>final-round</hl>."
  exists: "<prefix><err>There's already an arena called <errval><arena></errval><err>. Pick another id, or change it with <hl>/bingo arena edit <arena></hl>."
  unknown-preset: "<prefix><err>There's no preset called <errval><value></errval><err>. Presets: <hl><presets></hl>."
  invalid-preset-name: "<prefix><err><errval><value></errval><err> can't be a preset name. Use a-z, 0-9, _ and -."
  too-many-teams: "<prefix><err>There are <hl><teams></hl> teams, so an arena can't ask for more. Add teams to config.yml first."
  in-use: "<prefix><err>Arena <errval><arena></errval><err> has a round in progress. Stop it with <hl>/bingo stop</hl> first."
  file-unreadable: "<prefix><err>arenas.yml has a mistake, so nothing is saved until it's fixed. Check the console, fix the file and run <hl>/bingo reload</hl>."
  created: "<prefix><ok>Arena <hl><arena></hl> created.</ok>"
  deleted: "<prefix><body>Arena <hl><arena></hl> deleted."
  delete-confirm: "<prefix><err>This deletes arena <errval><arena></errval><err> for good. Run <hl>/bingo arena delete <arena> confirm</hl> to go ahead."
  updated: "<prefix><ok><hl><option></hl> of <hl><arena></hl> is now <hl><value></hl>.</ok>"
  seed-after-reset: "<prefix><body>The world of <hl><arena></hl> already exists. The new seed applies after <hl>/bingo arena reset <arena></hl>."
  preset-applied: "<prefix><ok>Preset <hl><preset></hl> applied to <hl><arena></hl>.</ok>"
  preset-saved: "<prefix><ok>The settings of <hl><arena></hl> are saved as preset <hl><preset></hl>.</ok>"
  unknown-option: "<prefix><err>There's no setting called <errval><value></errval><err>. Settings: <hl><options></hl>."
  modern-only: "<prefix><err><errval><option></errval><err> only does something on BingoRush Modern (Paper 26); this server leaves it as arenas.yml has it."
  selected: "<prefix><ok>The next round is played in <hl><arena></hl>.</ok>"
