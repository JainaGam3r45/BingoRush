# BingoRush messages, English.
# Everything a player reads lives here, in MiniMessage. The palette below is
# the only place colors are defined: change those hex values and the whole
# plugin follows. Text a player controls (their name, a team name) arrives
# unparsed, so it cannot inject tags.
#
# To add a language, copy this file to messages_<code>.yml in the same folder,
# translate it and set language: <code> in config.yml. Keys you leave out fall
# back to the English text.

palette:
  body: "#FFF3D6"
  hl: "#FFC233"
  ok: "#6BE585"
  err: "#FF6B6B"
  errval: "#FF2E2E"
  muted: "#8C8C8C"

brand: "<gradient:#FFD23F:#FF8A1F><b>BingoRush</b></gradient>"
prefix: "<brand> <muted>»</muted> "

# The header and one entry per command; the tree in BingoCommand decides who
# sees which. <command> is the syntax, <description> what it does.
help:
  header: "<brand> <hl>Commands"
  join: "<white>/bingo join <hl>[team]</hl></white> <muted>|</muted> <body>Join a team"
  card: "<white>/bingo card</white> <muted>|</muted> <body>Open your card"
  card-spectator: "<white>/bingo card <hl><team></hl></white> <muted>|</muted> <body>Watch a team's card"
  leave: "<white>/bingo leave</white> <muted>|</muted> <body>Leave your team"
  spectate: "<white>/bingo spectate</white> <muted>|</muted> <body>Watch the running round as a spectator"
  coords: "<white>/bingo coords</white> <muted>|</muted> <body>Send your coordinates to your team"
  start: "<white>/bingo start <hl>[items|advancements]</hl> <hl>[lockout:true|false]</hl> <hl>[seed]</hl></white> <muted>|</muted> <body>Start a round"
  setup: "<white>/bingo setup</white> <muted>|</muted> <body>Open the round setup panel"
  stop: "<white>/bingo stop</white> <muted>|</muted> <body>Stop the round"
  pause: "<white>/bingo pause</white> <muted>|</muted> <body>Pause the round"
  resume: "<white>/bingo resume</white> <muted>|</muted> <body>Resume the round"
  reroll: "<white>/bingo reroll</white> <muted>|</muted> <body>Draw a new card for the next round"
  teams: "<white>/bingo teams</white> <muted>|</muted> <body>Open the team menu"
  teams-admin: "<white>/bingo teams add|remove|join|clear</white> <muted>|</muted> <body>Manage teams"
  reload: "<white>/bingo reload</white> <muted>|</muted> <body>Reload the config"
  history: "<white>/bingo history <hl>[id|page]</hl></white> <muted>|</muted> <body>Browse past matches"
  export: "<white>/bingo export <hl><id></hl></white> <muted>|</muted> <body>Show where a match file is saved"
  version: "<white>/bingo version</white> <muted>|</muted> <body>Show the version and check for updates"

no-permission: "<prefix><err>You don't have permission to do that."
players-only: "<prefix><err>This command only works in game."

# Teams.
team-joined: "<prefix><body>You joined team <team><body>."
team-left: "<prefix><body>You left your team."
team-not-in: "<prefix><err>You're not on a team. Join one with <hl>/bingo join</hl>."
team-not-found: "<prefix><err>There's no team called <errval><name></errval><err>."
team-full: "<prefix><err>Team <team><err> is full."
team-all-full: "<prefix><err>Every team is full."
team-already-in: "<prefix><err>You're already on team <team><err>. Leave it before switching."
team-created: "<prefix><body>Team <team><body> created."
team-removed: "<prefix><body>Team <team><body> removed."
team-name-taken: "<prefix><err>A team called <errval><name></errval><err> already exists."
team-already-there: "<prefix><err><player><err> is already on team <team><err>."
team-assigned: "<prefix><body><player><body> joined team <team><body>."
team-coords: "<prefix><team> <body><player> is at <hl>X: <x>, Y: <y>, Z: <z></hl>"
compass-no-teammate: "<muted>No teammates nearby in this world</muted>"
compass-tracking: "<body>Tracking <hl><player></hl> <muted>(<distance>m)</muted>"
teams-locked: "<prefix><err>Teams can't change while a round is running."
team-cleared: "<prefix><body>All teams have been emptied."
team-list-header: "<brand> <hl>Teams"
team-list-entry: " <hl>➤</hl> <team> <muted>|</muted> <body><count>/<max> players <join>"
team-auto-name: "Team <count>"

# Shown by /bingo join when several teams have room: one button per team.
# The button and its tooltip are rendered by the plugin; <join> in the list
# entry above is the same button.
team-pick: "<prefix><body>Pick a team by clicking a button."
team-join-button: "<hl>[Join]</hl>"
team-join-hover: "<body>Join team <team>"

# Round flow.
round-already-running: "<prefix><err>A round is already running. Stop it with <hl>/bingo stop</hl>."
round-not-running: "<prefix><err>No round is running."
round-not-started: "<prefix><err>The round hasn't started yet."
round-already-paused: "<prefix><err>The round is already paused."
round-not-paused: "<prefix><err>The round isn't paused."
round-config-broken: "<prefix><err>Can't start: config.yml has errors. Check the console."
round-advancements-unsupported: "<prefix><err>Advancement rounds need Minecraft 1.12 or newer."
round-countdown-chat: "<prefix><body>The round starts in <hl><count></hl> <body>seconds."
round-countdown-title: "<gradient:#FFD23F:#FF8A1F><b><count></b></gradient>"
round-started-title: "<gradient:#FFD23F:#FF8A1F><b>Bingo!</b></gradient>"
round-started-subtitle: "<body>Go grab the items on your card!"
round-started-subtitle-advancements: "<body>Go complete the advancements on your card!"
round-started-chat: "<prefix><body>The round is on! Open your card with <hl>/bingo card</hl>."
round-cleared-inventories: "<prefix><body>Inventories have been cleared; you'll get yours back when the round ends."
round-stopped: "<prefix><body>An admin stopped the round."
round-paused: "<prefix><body>Round paused. Your card stays as it is until it resumes."
round-resumed: "<prefix><body>The round is back on."
round-restored-admin: "<prefix><body>An unfinished round from before the restart was restored. Use <hl>/bingo resume</hl> to continue it or <hl>/bingo stop</hl> to drop it.</body>"
reroll-done: "<prefix><body>New card ready with seed <hl><seed></hl>."
reloaded: "<prefix><body>Config reloaded."
round-won-title: "<gradient:#FFD23F:#FF8A1F><b><team> wins!</b></gradient>"
round-won-subtitle: "<body>Round won in <hl><time></hl>"
round-won-chat: "<prefix><body>Team <team><body> wins the round in <hl><time></hl><body>!"
round-time-up-title: "<gradient:#FF6B6B:#FF2E2E><b>Time's up!</b></gradient>"
round-time-up-chat: "<prefix><body>Time's up. Team <team><body> wins with <hl><count></hl> <body>cells."
round-no-claims: "<prefix><body>Time's up, and nobody claimed a single cell."
round-last-team-chat: "<prefix><body>Team <team><body> is the last one standing and wins the round in <hl><time></hl><body>!"
round-all-eliminated: "<prefix><body>Every team is out of lives."
round-all-eliminated-winner: "<prefix><body>Team <team><body> wins with <hl><count></hl> <body>cells."
lives-left: "<prefix><body>You died. <hl><lives></hl> <body>lives left."
lives-left-one: "<prefix><body>You died. <hl>1</hl> <body>life left."
player-eliminated: "<prefix><hl><player></hl> <body>(<team><body>) is out of lives."
team-eliminated: "<prefix><body>Team <team><body> has been knocked out."
eliminated-spectator: "<prefix><body>You're out of lives. Keep watching the round as a spectator."
eliminated-cannot-join: "<prefix><err>You're out of lives this round. You can play again in the next one."
# Chat lines for players in a round, used when round-chat in config.yml is
# "custom". <message> is Minecraft's own death line, shown in each player's
# language. <advancement> is the advancement name with its usual hover text.
death-message: "<prefix><muted>☠</muted> <body><message>"
death-message-lives: "<prefix><muted>☠</muted> <body><message> <muted>(lives: <hl><lives></hl><muted>)"
death-message-eliminated: "<prefix><err>☠</err> <body><message> <muted>· <err>out of lives, now spectating</err>"
advancement-message: "<prefix><hl><player></hl> <muted>(<team><muted>)</muted> <body>has made the advancement <advancement>"
# The round card in the advancements screen (L). <detail> is the advancement
# description in advancement rounds and card-tab-cell-item in item rounds.
card-tab-title: "<brand>"
card-tab-description: "<body>Your team's card for this round.<br><muted>Seed <seed>"
card-tab-cell-title: "<hl>#<number></hl> <white><item>"
card-tab-cell-description: "<body><detail><br><muted>Row <row>, column <column>"
card-tab-cell-item: "Have it in your inventory to mark it."

# Match breakdown.
breakdown:
  header: "<brand> <hl>Match Summary</hl>"
  separator: "<muted><st>                             </st></muted>"
  ranking-entry: " <hl>#<pos></hl> <team><muted>:</muted> <hl><count></hl> <body>cells</body>"
  ranking-entry-singular: " <hl>#<pos></hl> <team><muted>:</muted> <hl><count></hl> <body>cell</body>"
  first-claim: " <muted>»</muted> <white>First claim:</white> <hl><item></hl> <body>by <team> <body>(<time>)</body>"
  first-claim-none: " <muted>»</muted> <white>First claim:</white> <muted>None</muted>"
  total-time: " <muted>»</muted> <white>Total time:</white> <hl><time></hl>"

# Claims.
claim: "<prefix><body>Team <team><body> got <hl><item></hl> <muted>(<count>/<total>)</muted>"
claim-actionbar: "<ok>+ <item></ok> <body>claimed <muted>(<count>/<total>)</muted>"
claim-advancement: "<prefix><body>Team <team><body> completed <hl><advancement></hl> <muted>(<count>/<total>)</muted>"
claim-advancement-actionbar: "<ok>+ <advancement></ok> <body>completed <muted>(<count>/<total>)</muted>"
claim-advancement-title: "<gradient:#FFD23F:#FF8A1F><b>Advancement made!</b></gradient>"
claim-advancement-subtitle: "<body><advancement> <muted>(<count>/<total>)</muted>"
lockout-cell-lost-actionbar: "<err>✖ <item></err> <body>locked by <team>"
lockout-advancement-lost-actionbar: "<err>✖ <advancement></err> <body>locked by <team>"

# Card menu.
menu-title: "<brand> <hl>Card</hl>"
menu-title-spectator: "<brand> <hl>Card - <team></hl>"
card-opened: "<prefix><body>Here's your card."
card-opened-spectator: "<prefix><body>Watching team <team><body>'s card."
card-not-playing: "<prefix><err>You're not playing this round. Join with <hl>/bingo join</hl>."
menu-cell-name: "<!italic><gradient:#FFD23F:#FF8A1F><b><item></b></gradient>"
menu-cell-advancement-desc: "<!italic><muted><description></muted>"
menu-cell-separator: "<!italic><muted><st>                             </st></muted>"
menu-cell-difficulty: "<!italic><muted>»</muted> <white>Difficulty:</white> <tier>"
tier-easy: "<ok>Easy</ok>"
tier-medium: "<hl>Medium</hl>"
tier-hard: "<color:#FF8A1F>Hard</color>"
tier-epic: "<color:#FF55FF>Epic</color>"
menu-status-available: "<!italic><muted>»</muted> <white>Status:</white> <ok>Up for grabs</ok>"
menu-status-available-hint: "<!italic><muted><i>Get this item for your team</i></muted>"
menu-status-available-hint-advancement: "<!italic><muted><i>Complete this advancement for your team</i></muted>"
menu-status-own: "<!italic><muted>»</muted> <white>Status:</white> <ok>✔ Done</ok>"
menu-status-own-by: "<!italic><muted>»</muted> <white>By:</white> <team>"
menu-status-own-time: "<!italic><muted>»</muted> <white>At:</white> <hl><time></hl>"
menu-status-rival: "<!italic><muted>»</muted> <white>Status:</white> <err>Claimed by <team></err>"
menu-status-lockout-own: "<!italic><muted>»</muted> <white>Status:</white> <ok>✔ Taken by your team</ok>"
menu-status-lockout-locked: "<!italic><muted>»</muted> <white>Status:</white> <err>LOCKED / STOLEN</err>"
menu-status-lockout-claimed-by: "<!italic><muted>»</muted> <white>Claimed by:</white> <team>"
menu-status-lockout-time: "<!italic><muted>»</muted> <white>At:</white> <hl><time></hl>"
menu-status-lockout-hint: "<!italic><muted><i>This cell is gone for this round.</i></muted>"
menu-cell-tier: "<muted>Tier:</muted> <hl><tier></hl>"
menu-cell-unclaimed: "<muted>Unclaimed</muted>"
menu-claimed-by: "<body>Taken by <team>"
menu-claimed-at: "<muted>at <time>"

# Team menu (lobby).
team-menu-title: "<brand> <hl>Teams</hl>"
team-menu-item-name: "<!italic><team>"
team-menu-already: "<prefix><body>You're already on team <team><body>."
team-menu-lore-count: "<!italic><muted>»</muted> <white>Players:</white> <hl><count>/<max></hl>"
team-menu-lore-members: "<!italic><muted>»</muted> <white>Members:</white>"
team-menu-lore-member: "<!italic>  <body><member>"
team-menu-lore-more: "<!italic>  <muted>+<more> more</muted>"
team-menu-lore-empty: "<!italic>  <muted>(empty)</muted>"
team-menu-lore-join: "<!italic><muted><i>Click to join</i></muted>"
team-menu-lore-yours: "<!italic><ok>✔ Your team</ok>"
team-menu-lore-full: "<!italic><err>Full</err>"
team-menu-leave-name: "<!italic><err><b>Leave team</b></err>"
team-menu-leave-lore: "<!italic><body>Click to go without a team."

# Host setup panel.
setup-menu-title: "<brand> <hl>Round setup</hl>"
setup-mode-name: "<!italic><gradient:#FFD23F:#FF8A1F><b>Game mode</b></gradient>"
setup-win-name: "<!italic><gradient:#FFD23F:#FF8A1F><b>Win condition</b></gradient>"
setup-lockout-name: "<!italic><gradient:#FFD23F:#FF8A1F><b>Lockout</b></gradient>"
setup-time-name: "<!italic><gradient:#FFD23F:#FF8A1F><b>Time limit</b></gradient>"
setup-lives-name: "<!italic><gradient:#FFD23F:#FF8A1F><b>Lives</b></gradient>"
setup-value-items: "<hl>Items</hl>"
setup-value-advancements: "<ok>Advancements</ok>"
setup-value-line: "<hl>First line</hl>"
setup-value-full: "<hl>Full card</hl>"
setup-value-on: "<ok>On</ok>"
setup-value-off: "<err>Off</err>"
setup-time-minutes: "<hl><minutes>m</hl>"
setup-time-minutes-seconds: "<hl><minutes>m <seconds>s</hl>"
setup-value-lives-unlimited: "<hl>Unlimited</hl>"
setup-value-lives-hardcore: "<err>Hardcore (1 life)</err>"
setup-value-lives: "<hl><lives> lives</hl>"
setup-time-unlimited: "<muted>No limit</muted>"
setup-lore-value: "<!italic><muted>»</muted> <white>Value:</white> <value>"
setup-lore-click: "<!italic><muted><i>Click to change</i></muted>"
# Descriptions under each option of /bingo setup. <br> starts a new lore line.
setup-mode-desc-items: "<body>Every cell is an item.<br><body>Have it in your inventory to mark it."
setup-mode-desc-advancements: "<body>Every cell is a Minecraft advancement.<br><body>Complete it during the round to mark it.<br><muted>Ones you already had are set aside<br><muted>and come back when the round ends."
setup-win-desc-line: "<body>The first team to finish a row,<br><body>a column or a diagonal wins."
setup-win-desc-full: "<body>The first team to mark all<br><body><hl>25</hl> cells wins."
setup-win-desc-full-lockout: "<body>With lockout, the first team<br><body>to hold <hl>13</hl> cells wins."
setup-lockout-desc: "<body>Each cell can belong to one team only.<br><body>If a rival marks it first,<br><body>it's gone for you."
setup-time-desc: "<body>When time runs out, the team<br><body>with the most cells wins."
setup-lives-desc: "<body>How many deaths each player can take.<br><body>Out of lives means spectating, and a<br><body>team with nobody left is out.<br><body>The last team standing wins."
setup-start-name: "<!italic><ok><b>Start round</b></ok>"
setup-start-mode: "<!italic><muted>»</muted> <white>Mode:</white> <value>"
setup-start-win: "<!italic><muted>»</muted> <white>Win:</white> <value>"
setup-start-lockout: "<!italic><muted>»</muted> <white>Lockout:</white> <value>"
setup-start-time: "<!italic><muted>»</muted> <white>Time:</white> <value>"
setup-start-lives: "<!italic><muted>»</muted> <white>Lives:</white> <value>"
setup-start-hint: "<!italic><muted><i>Click to start the countdown</i></muted>"

# Spectators.
late-join-spectate: "<prefix><body>The round has already started, so you're watching as a spectator. You can play in the next one."
spectate-started: "<prefix><body>You're watching as a spectator. Your game mode comes back when the round ends."
spectate-in-team: "<prefix><err>You're playing on team <team><err>. Leave it with <hl>/bingo leave</hl> first."

# The physical card item handed out when the round starts.
card-item-name: "<brand> <hl>Card</hl>"
card-item-lore: "<body>Right-click to see your cells."

# Interface text.
sidebar-title: "  <brand>  "
sidebar-separator: "<muted><st>                   </st></muted>"
sidebar-time: "<white>Time:</white> <hl><time></hl>"
sidebar-teams-header: "<white><b>Teams:</b></white>"
sidebar-team-entry: "<color>❙</color> <team>: <white><count>/<total></white>"
sidebar-footer: "<muted>jifercraft.com</muted>"
bossbar-title: "<brand> <hl><time></hl> <body>left"

# Updates.
version-info: "<brand> <body>Version: <hl>v<current></hl>"
update-checking: "<prefix><body>Checking GitHub for updates..."
update-available: "<prefix><body>A new version is out: <ok>v<latest></ok> <body>(you have <muted>v<current></muted>). Download it at <hl><click:open_url:'<url>'><url></click></hl>"
update-up-to-date: "<prefix><body>BingoRush is up to date (<ok>v<current></ok>)."
update-rate-limited: "<prefix><err>GitHub's rate limit was hit. Try again later."
update-not-found: "<prefix><muted>No releases have been published yet.</muted>"
update-error: "<prefix><err>Couldn't reach GitHub to check for updates."

# Match history.
history:
  disabled: "<prefix><err>Match history is turned off in config.yml."
  empty: "<prefix><muted>No matches have been recorded yet.</muted>"
  header: "<brand> <hl>Match History <muted>(Page <page>/<total>)</muted></hl>"
  entry: " <hl>#<id></hl> <muted>|</muted> <white><date></white> <muted>-</muted> <body>Winner: <winner> <body>(<time>)</body> <view>"
  view-button: "<hl>[View]</hl>"
  view-hover: "<body>See the details of match <hl>#<id></hl>"
  pagination: "<muted><st>                             </st></muted>\n <prev> <muted>|</muted> <next>"
  prev-button: "<hl>« Previous</hl>"
  prev-hover: "<body>Go to page <page>"
  next-button: "<hl>Next »</hl>"
  next-hover: "<body>Go to page <page>"
  detail-header: "<brand> <hl>Match Details <muted>#<id></muted></hl>"
  detail-date: " <muted>»</muted> <white>Date:</white> <hl><date></hl>"
  detail-mode: " <muted>»</muted> <white>Mode:</white> <hl><mode></hl> <muted>(<win_mode><lockout>)</muted>"
  detail-duration: " <muted>»</muted> <white>Duration:</white> <hl><time></hl>"
  detail-seed: " <muted>»</muted> <white>Seed:</white> <muted><seed></muted>"
  detail-winner: " <muted>»</muted> <white>Winner:</white> <winner> <body>(<count> cells)</body>"
  detail-winner-none: " <muted>»</muted> <white>Winner:</white> <muted>No winner (draw or time)</muted>"
  detail-ranking-header: " <muted>»</muted> <white>Standings:</white>"
  detail-ranking-entry: "   <hl>#<pos></hl> <team><muted>:</muted> <hl><count></hl> <body>cells</body>"
  detail-first-claim: " <muted>»</muted> <white>First claim:</white> <hl><item></hl> <body>by <team> <body>(<time>)</body>"
  detail-first-claim-none: " <muted>»</muted> <white>First claim:</white> <muted>None</muted>"
  detail-export-hint: " <muted>»</muted> <white>Saved at:</white> <muted>plugins/BingoRush/data/matches/<file></muted>"
  exported: "<prefix><body>Match <hl>#<id></hl> is saved at <hl>plugins/BingoRush/data/matches/<file></hl>."
  not-found: "<prefix><err>No match found with id <errval><id></errval><err>."
  invalid-page: "<prefix><err>The page has to be a number between 1 and <total>."
  cleared: "<prefix><body>Match history cleared."
