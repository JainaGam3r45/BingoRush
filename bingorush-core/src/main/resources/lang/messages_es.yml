# BingoRush messages.
# Everything a player reads lives here, in MiniMessage. The palette below is
# the only place colors are defined: change those hex values and the whole
# plugin follows. Text a player controls (their name, a team name) arrives
# unparsed, so it cannot inject tags.

palette:
  body: "#FFF3D6"
  hl: "#FFC233"
  ok: "#6BE585"
  err: "#FF6B6B"
  errval: "#FF2E2E"
  muted: "#8C8C8C"

brand: "<gradient:#FFD23F:#FF8A1F><b>BingoRush</b></gradient>"
prefix: "<brand> <muted>»</muted> "

# The header and one entry per command; the tree in BingoCommand decides who
# sees which. <command> is the syntax, <description> what it does.
help:
  header: "<brand> <hl>Comandos"
  join: "<white>/bingo join <hl>[equipo]</hl></white> <muted>|</muted> <body>Únete a un equipo"
  card: "<white>/bingo card</white> <muted>|</muted> <body>Abre tu cartilla"
  card-spectator: "<white>/bingo card <hl><equipo></hl></white> <muted>|</muted> <body>Mira la cartilla de un equipo"
  leave: "<white>/bingo leave</white> <muted>|</muted> <body>Sal de tu equipo"
  spectate: "<white>/bingo spectate</white> <muted>|</muted> <body>Mira la ronda en marcha como espectador"
  coords: "<white>/bingo coords</white> <muted>|</muted> <body>Envía tus coordenadas a tu equipo"
  start: "<white>/bingo start <hl>[items|advancements]</hl> <hl>[lockout:true|false]</hl> <hl>[semilla]</hl></white> <muted>|</muted> <body>Empieza una ronda"
  setup: "<white>/bingo setup</white> <muted>|</muted> <body>Abre el panel para preparar la ronda"
  stop: "<white>/bingo stop</white> <muted>|</muted> <body>Detén la ronda"
  pause: "<white>/bingo pause</white> <muted>|</muted> <body>Pausa la ronda"
  resume: "<white>/bingo resume</white> <muted>|</muted> <body>Reanuda la ronda"
  reroll: "<white>/bingo reroll</white> <muted>|</muted> <body>Prepara otra cartilla para la próxima ronda"
  teams: "<white>/bingo teams</white> <muted>|</muted> <body>Abre el menú de equipos"
  teams-admin: "<white>/bingo teams add|remove|join|clear</white> <muted>|</muted> <body>Gestiona los equipos"
  reload: "<white>/bingo reload</white> <muted>|</muted> <body>Recarga la configuración"
  history: "<white>/bingo history <hl>[id|página]</hl></white> <muted>|</muted> <body>Consulta el historial de partidas"
  export: "<white>/bingo export <hl><id></hl></white> <muted>|</muted> <body>Muestra la ruta del archivo de una partida"
  version: "<white>/bingo version</white> <muted>|</muted> <body>Muestra la versión y comprueba actualizaciones"
  lobby: "<white>/bingo lobby</white> <muted>|</muted> <body>Teletranspórtate al lobby de espera"
  randomjoin: "<white>/bingo randomjoin</white> <muted>|</muted> <body>Únete a una partida disponible"
  setlobby: "<white>/bingo setlobby</white> <muted>|</muted> <body>Establece el punto de espera del lobby"
  season: "<white>/bingo season</white> <muted>|</muted> <body>Estado de temporada, fases y pruebas"

no-permission: "<prefix><err>No tienes permiso para eso."
players-only: "<prefix><err>Este comando solo se puede usar dentro del juego."

# Lobby.
lobby-set: "<prefix><ok>Punto de lobby establecido en <hl><world></hl> <muted>(<x>, <y>, <z>)</muted>.</ok>"
lobby-teleported: "<prefix><body>Teletransportado al lobby."
lobby-not-set: "<prefix><err>Aún no se ha establecido un lobby. Un administrador puede configurarlo con <hl>/bingo setlobby</hl>."

# Signs and game joining.
sign-created: "<prefix><ok>Cartel de Bingo creado para el mapa <hl><map></hl>.</ok>"
sign-removed: "<prefix><body>Cartel de Bingo eliminado."
sign-cannot-break: "<prefix><err>Solo los administradores pueden romper carteles de Bingo."
sign-game-full: "<prefix><err>Esa partida está llena."
sign-already-running: "<prefix><err>Esa partida ya ha comenzado."
sign-status-waiting: "<green>[ESPERANDO]</green>"
sign-status-starting: "<yellow>[INICIANDO]</yellow>"
sign-status-paused: "<gold>[PAUSA]</gold>"
sign-status-in-game: "<red>[EN JUEGO]</red>"
randomjoin-none-available: "<prefix><err>No hay partidas disponibles para unirse en este momento."
randomjoin-joined: "<prefix><body>Te has unido a la partida <hl><map></hl>."

# Teams.
team-joined: "<prefix><body>Te has unido al equipo <team><body>."
team-left: "<prefix><body>Has salido del equipo."
team-not-in: "<prefix><err>No estás en ningún equipo. Únete con <hl>/bingo join</hl>."
team-not-found: "<prefix><err>No existe el equipo <errval><name></errval><err>."
team-full: "<prefix><err>El equipo <team><err> está completo."
team-all-full: "<prefix><err>Todos los equipos están llenos."
team-already-in: "<prefix><err>Ya estás en el equipo <team><err>. Sal de él antes de cambiarte."
team-created: "<prefix><body>Equipo <team><body> creado."
team-removed: "<prefix><body>Equipo <team><body> eliminado."
team-name-taken: "<prefix><err>Ya existe un equipo llamado <errval><name></errval><err>."
team-already-there: "<prefix><err><player><err> ya pertenece al equipo <team><err>."
team-assigned: "<prefix><body><player><body> se ha unido al equipo <team><body>."
team-assign-eliminated: "<prefix><err><player><err> se ha quedado sin vidas en esta ronda y no puede unirse a un equipo."
team-coords: "<prefix><team> <body><player> está en <hl>X: <x>, Y: <y>, Z: <z></hl>"
compass-no-teammate: "<muted>No hay compañeros cerca en este mundo</muted>"
compass-tracking: "<body>Rastreando a <hl><player></hl> <muted>(<distance>m)</muted>"
teams-locked: "<prefix><err>No puedes cambiar los equipos durante una ronda."
team-cleared: "<prefix><body>Se han vaciado todos los equipos."
team-list-header: "<brand> <hl>Equipos"
team-list-entry: " <hl>➤</hl> <team> <muted>|</muted> <body><count>/<max> jugadores <join>"
team-auto-name: "Equipo <count>"

# Shown by /bingo join when several teams have room: one button per team.
# The button and its tooltip are rendered by the plugin; <join> in the list
# entry above is the same button.
team-pick: "<prefix><body>Elige equipo: pulsa un botón."
team-join-button: "<hl>[Unirse]</hl>"
team-join-hover: "<body>Unirse al equipo <team>"

# Round flow.
round-already-running: "<prefix><err>Ya hay una ronda en marcha. Detenla con <hl>/bingo stop</hl>."
round-not-running: "<prefix><err>No hay ninguna ronda en marcha."
round-not-started: "<prefix><err>La ronda aún no ha empezado."
round-already-paused: "<prefix><err>La ronda ya está en pausa."
round-not-paused: "<prefix><err>La ronda no está en pausa."
round-config-broken: "<prefix><err>No se puede empezar: hay errores en config.yml. Mira la consola."
round-need-more-teams: "<prefix><err>No se puede iniciar: se necesitan al menos 2 equipos con jugadores.</err>"
round-advancements-unsupported: "<prefix><err>Las rondas de logros necesitan Minecraft 1.12 o posterior."
round-countdown-chat: "<prefix><body>La ronda empieza en <hl><count></hl> <body>segundos."
round-countdown-title: "<gradient:#FFD23F:#FF8A1F><b><count></b></gradient>"
round-started-title: "<gradient:#FFD23F:#FF8A1F><b>¡Bingo!</b></gradient>"
round-started-subtitle: "<body>¡Corre a por los objetos de tu cartilla!"
round-started-subtitle-advancements: "<body>¡Completa los logros de tu cartilla!"
round-started-chat: "<prefix><body>¡La ronda ha empezado! Abre tu cartilla con <hl>/bingo card</hl>."
round-cleared-inventories: "<prefix><body>Los inventarios se han vaciado; los recuperarás al terminar."
round-stopped: "<prefix><body>El administrador ha detenido la ronda."
round-paused: "<prefix><body>Ronda en pausa. La cartilla no cambia mientras tanto."
round-resumed: "<prefix><body>La ronda continúa."
round-restored-admin: "<prefix><body>Se ha restaurado una ronda previa no finalizada. Usa <hl>/bingo resume</hl> para continuarla o <hl>/bingo stop</hl> para descartarla.</body>"
reroll-done: "<prefix><body>Nueva cartilla preparada con la semilla <hl><seed></hl>."
reloaded: "<prefix><body>Configuración recargada."
round-won-title: "<gradient:#FFD23F:#FF8A1F><b>¡<team> gana!</b></gradient>"
round-won-subtitle: "<body>Ronda ganada en <hl><time></hl>"
round-won-chat: "<prefix><body>¡El equipo <team><body> gana la ronda en <hl><time></hl><body>!"
round-time-up-title: "<gradient:#FF6B6B:#FF2E2E><b>¡Tiempo!</b></gradient>"
round-time-up-chat: "<prefix><body>Se acabó el tiempo. Gana el equipo <team><body> con <hl><count></hl> <body>casillas."
round-no-claims: "<prefix><body>Se acabó el tiempo y nadie reclamó ninguna casilla."
round-last-team-chat: "<prefix><body>¡El equipo <team><body> es el último en pie y gana la ronda en <hl><time></hl><body>!"
round-all-eliminated: "<prefix><body>Todos los equipos se han quedado sin vidas."
round-all-eliminated-winner: "<prefix><body>Gana el equipo <team><body> con <hl><count></hl> <body>casillas."
lives-left: "<prefix><body>Has muerto. Te quedan <hl><lives></hl> <body>vidas."
lives-left-one: "<prefix><body>Has muerto. Te queda <hl>1</hl> <body>vida."
player-eliminated: "<prefix><hl><player></hl> <body>(<team><body>) se ha quedado sin vidas."
team-eliminated: "<prefix><body>El equipo <team><body> ha sido eliminado."
eliminated-spectator: "<prefix><body>Te has quedado sin vidas. Sigue la ronda como espectador."
eliminated-cannot-join: "<prefix><err>Te has quedado sin vidas en esta ronda. Podrás jugar en la siguiente."
# Chat lines for players in a round, used when round-chat in config.yml is
# "custom". <message> is Minecraft's own death line, shown in each player's
# language. <advancement> is the advancement name with its usual hover text.
death-message: "<prefix><muted>☠</muted> <body><message>"
death-message-lives: "<prefix><muted>☠</muted> <body><message> <muted>(vidas: <hl><lives></hl><muted>)"
death-message-eliminated: "<prefix><err>☠</err> <body><message> <muted>· <err>sin vidas, pasa a espectador</err>"
advancement-message: "<prefix><hl><player></hl> <muted>(<team><muted>)</muted> <body>ha conseguido el logro <advancement>"
# The round card in the advancements screen (L). <detail> is the advancement
# description in advancement rounds and card-tab-cell-item in item rounds.
card-tab-title: "<brand>"
card-tab-description: "<body>La cartilla de tu equipo en esta ronda.<br><muted>Semilla <seed>"
card-tab-cell-title: "<hl>#<number></hl> <white><item>"
card-tab-cell-description: "<body><detail><br><muted>Fila <row>, columna <column>"
card-tab-cell-item: "Tenlo en el inventario para marcarla."

# Match breakdown.
breakdown:
  header: "<brand> <hl>Resumen de la Partida</hl>"
  separator: "<muted><st>                             </st></muted>"
  ranking-entry: " <hl><pos>º</hl> <team><muted>:</muted> <hl><count></hl> <body>casillas</body>"
  ranking-entry-singular: " <hl><pos>º</hl> <team><muted>:</muted> <hl><count></hl> <body>casilla</body>"
  first-claim: " <muted>»</muted> <white>Primer reclamo:</white> <hl><item></hl> <body>por <team> <body>(<time>)</body>"
  first-claim-none: " <muted>»</muted> <white>Primer reclamo:</white> <muted>Ninguno</muted>"
  total-time: " <muted>»</muted> <white>Tiempo total:</white> <hl><time></hl>"

# Claims.
claim: "<prefix><body>El equipo <team><body> consiguió <hl><item></hl> <muted>(<count>/<total>)</muted>"
claim-actionbar: "<ok>+ <item></ok> <body>reclamado <muted>(<count>/<total>)</muted>"
claim-advancement: "<prefix><body>El equipo <team><body> completó el logro <hl><advancement></hl> <muted>(<count>/<total>)</muted>"
claim-advancement-actionbar: "<ok>+ <advancement></ok> <body>completado <muted>(<count>/<total>)</muted>"
claim-advancement-title: "<gradient:#FFD23F:#FF8A1F><b>¡Logro conseguido!</b></gradient>"
claim-advancement-subtitle: "<body><advancement> <muted>(<count>/<total>)</muted>"
lockout-cell-lost-actionbar: "<err>✖ <item></err> <body>bloqueado por <team>"
lockout-advancement-lost-actionbar: "<err>✖ <advancement></err> <body>bloqueado por <team>"

