# Vanilla sound keys played at each moment. An empty value plays nothing;
# a key that does not exist is reported at load and then ignored.
sounds:
  claim: entity.experience_orb.pickup
  win: ui.toast.challenge_complete
  countdown: block.note_block.pling
  start: block.beacon.activate
  lockout-lost: block.note_block.bass
  # Menus: clicks in the lobby menus and the chime for joining a team.
  menu-click: ui.button.click
  team-chime: block.note_block.chime

# Update notifications from the GitHub repository.
# Checks run asynchronously in the background so they never slow down the server.
update-notifier:
  enabled: true
  on-join: true
  # Hours between automatic background checks while the server runs. 0 disables the timer.
  check-interval-hours: 24

# Match history and logs.
# Completed matches are saved asynchronously to data/matches/ as JSON files.
history:
  # Set to false to disable saving match results and in-game match history.
  enabled: true
  # Maximum number of match files to keep in data/matches/.
  # The oldest matches are deleted when new ones finish. 0 disables the limit.
  max-saved-matches: 50

# Sidebars for each stage. Turn one off (enabled: false) when another plugin
# owns the sidebar. Lines are MiniMessage with the palette tags of the
# language file and %placeholders%.
scoreboards:
  # Main lobby, between rounds.
  lobby:
    enabled: true
    title: "  <brand>  "
    lines:
      - "<muted><st>                   </st></muted>"
      - "<white>Player:</white> <hl>%player%</hl>"
      - "<white>Matches:</white> <hl>%matches%</hl>"
      - "<white>Wins:</white> <ok>%wins%</ok>"
      - "<white>Cells:</white> <hl>%cells%</hl>"
      - ""
      - "<white>Season:</white> <hl>%season%</hl>"
      - "<white>Online:</white> <ok>%online%</ok>"
      - "<muted><st>                   </st></muted>"
      - "<muted>%server%</muted>"

  # Waiting room of an arena, before its round starts.
  waiting:
    enabled: true
    title: "  <brand>  "
    lines:
      - "<muted><st>                   </st></muted>"
      - "<white>Arena:</white> <hl>%arena%</hl>"
      - "<white>Mode:</white> <hl>%mode%</hl>"
      - "<white>Players:</white> <ok>%players%</ok><muted>/%max%</muted>"
      - "<white>Your team:</white> %team%"
      - ""
      - "<white>Status:</white> %status%"
      - "<muted><st>                   </st></muted>"
      - "<muted>%server%</muted>"

  # During a round.
  playing:
    enabled: true
    title: "  <brand>  "
    team-format: "<color>❙</color> %team%: <white>%count%/%total%</white>"
    lines:
      - "<muted><st>                   </st></muted>"
      - "<white>Time:</white> <hl>%time%</hl>"
      - ""
      - "<white><b>Teams:</b></white>"
      - "%teams%"
      - ""
      - "<muted><st>                   </st></muted>"
      - "<muted>%server%</muted>"

# Seasonal extras for the holidays: snow and snowflakes around the lobby,
# fireworks on claims, a gift hunt, a season header in the player list and a
# countdown to the big day. Off by default, and nothing else in the plugin
# depends on it. Every block it places is put back when the dates run out or
# the season is switched off, even across restarts.
season:
  enabled: false
  # Month-day dates ("12-01", or "12-31 23:59") come back every year; full
  # timestamps ("2026-12-01T00:00:00Z") make a one-off season. Pre-season
  # only announces what is coming; active is the season itself; wrap-up
  # keeps the snow but takes the gifts down.
  pre-season-start: "11-25"
  active-start: "12-01"
  active-end: "12-31"
  wrap-up-end: "01-03"
  # Zone the dates are read in, such as Europe/Madrid or America/Buenos_Aires.
  # Empty uses the server's own.
  timezone: ""
  # Snowflakes over the lobby and during the countdown.
  snowfall: true
  # A small firework over a player who claims a cell.
  claim-firework: true
  # A layer of snow on the open floor around the lobby.
  lobby-snow: false
  # Blocks around the lobby spawn the snow and the gifts use.
  lobby-radius: 25
  # What players in the lobby get while the season runs, playing or not.
  lobby:
    # Snowflakes under their feet as they walk.
    snow-trail: true
    # The season header and footer in the player list.
    tab-header: true
    # A line in chat when they join.
    join-greeting: true
    # Days left to the highlight day, in the action bar.
    countdown: true
    # The big day, month-day: fireworks over the lobby all day long.
    highlight-day: "12-25"
    # A title and fireworks for everyone when the year changes.
    new-year: true
  gifts:
    enabled: true
    # Hide the gifts around the lobby on their own when the season starts.
    auto-spawn: true
    auto-spawn-count: 5
    # Blocks from a gift where the chime and the action bar hint start.
    proximity-radius: 8.0
    actionbar-clue: true
    title-clue: true
    # Each type has a name, a head texture, the particle and sounds around it
    # (namespaced keys, plain names mean minecraft:) and console commands run
    # as rewards, with %player% for the player's name.
    types:
      red_gift:
        name: "<red>Red Gift</red>"
        texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNmNlMDRjMTZhNjk1ZmYxMTk2NDFmNDdiZjYyOGE1NTYzOWZmMzIyOWIzNWZhNTJlNDI4Y2RiMWE2ZDk2MjA1ZSJ9fX0="
        particle: "happy_villager"
        proximity-sound: "block.note_block.chime"
        click-sound: "entity.player.levelup"
        click-particle: "firework"
        rewards:
          - "give %player% cookie 5"
          - "xp add %player% 20"
      green_gift:
        name: "<green>Green Gift</green>"
        texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzg2MTg1NWFiODc5ZTUyNzg2OWNlNzY0MTVlOTY1MjkxNmZjOGRhY2IyZTFkYzQ2MTNlMTg3MDE1NzhjNjkifX19"
        particle: "happy_villager"
        proximity-sound: "block.note_block.chime"
        click-sound: "entity.player.levelup"
        click-particle: "firework"
        rewards:
          - "give %player% pumpkin_pie 3"
          - "xp add %player% 25"
      golden_gift:
        name: "<yellow>Golden Gift</yellow>"
        texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMmI1NmZhMmViNWVjOWRhY2Y0YjMzNWY5OWI4MTZhN2NkNTg0ZGE0OWQzZDFkYmExOWU4OTU1OTlmYjliIn19fQ=="
