# BingoRush configuration.
# Values the plugin reads are checked when it loads this file; mistakes are
# printed to the console, one line each, naming the key to fix.

# Language of every message players read, from lang/messages_<language>.yml.
# "en" and "es" ship with the plugin. To add one, copy messages_en.yml to
# messages_<code>.yml, translate it and put the code here.
language: en

# The round settings below (game-mode down to lives, and time-limit,
# countdown and team-size) are what a new arena starts with, and what a
# round uses when there are no arenas and it is played in the main world.

# Game mode: "items" for classic item collection, "advancements" for vanilla
# advancement hunt.
game-mode: items

# How a round is won: "full" fills the whole card, "line" completes one row,
# column or diagonal.
win-mode: full

# Lockout mode: cells are exclusive. The first team to claim a cell locks it
# forever, preventing rivals from claiming it.
lockout: false

# Lives per player during a round. A player who uses them all watches the
# rest as a spectator, and a team with nobody left is out. When only one team
# is still standing it wins; if every team is out, the most cells wins.
# 0 means unlimited lives, 1 is hardcore.
lives: 0

# What chat shows when a player in a round dies or gets an advancement.
# "custom" uses the templates in the language file, "vanilla" keeps Minecraft's
# own line and "hidden" removes it. Death lines of players outside the round
# are left alone. Spigot cannot change a vanilla advancement line, so on this
# jar anything but "vanilla" turns the announceAdvancements rule off for the
# whole server during the round and puts it back afterwards.
round-chat:
  deaths: custom
  # Off by default here, see above: "custom" and "hidden" change a game rule for everyone.
  advancements: vanilla

# Show the round card as its own tab in the advancements screen (L), with the
# cells your team already has marked as done. Needs 1.12 or newer. On these
# versions the server adds the 26 tab entries one at a time and rereads every
# online player's advancements from disk after each one, which a busy server
# feels when the countdown starts, so it starts off here.
advancement-tab: false

# Lobby location where players wait before a round and return when it ends.
# Use /bingo setlobby in game to configure this automatically.
lobby:
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# Arenas live in arenas.yml and presets in presets.yml. Manage them in game
# with /bingo arena, or from the console with /bingo arena create, set and
# list. With no arenas, rounds are played in the main world.

# Round time limit in seconds. When it runs out, the team with the most
# claimed cells wins and an earlier last claim breaks a tie. 0 means no
# clock: the round runs until a team completes the card.
time-limit: 1800

# Seconds between /bingo start and the round itself. 0 starts right away.
countdown: 10

# Players per team. 1 plays solo.
team-size: 2

# Empty every inventory when the round starts and give the contents back when
# it ends. Stops players from bringing a pre-filled backpack.
clear-inventories: true

# Spread team members around the world spawn when the round starts, so
# nobody spawns on top of the chests.
scatter-players: true
scatter-radius: 24

# What a player who joins after the round started gets. "join" puts them in a
# team like everyone else, with their inventory emptied. "spectate" makes them
# a spectator until the round ends, when their game mode comes back. Players
# with bingo.admin are never forced, and players already online without a
# team are left alone. Anyone without a team can use /bingo spectate.
late-join: join

# Teams for the event. Each one has a name, a color and, if you like, a tag:
# the short mark in front of its players' names (the first letter when left
# out). Colors are names such as red, blue, dark_green or gold, or hex like
# "#FF5555". Players join with /bingo join, /bingo join <team> or the
# /bingo teams menu. With no teams here, the plugin invents one per group as
# players join. /bingo teams add, auto, color and tag change them in game
# until the server restarts.
teams:
  - name: Red
    color: red
  - name: Blue
    color: blue
  - name: Green
    color: green
  - name: Yellow
    color: yellow

# What shows in front of a player's name in the player list, above their head
# and in chat, through scoreboard teams. One line for each moment:
# waiting in the lobby, playing, and watching as a spectator (knocked out, or
# /bingo spectate). <tag> is the team's tag, <team> its name, and
# <team_color> paints with the team color. The name itself takes the team
# color, gray for spectators. Turn it off when another plugin owns the
# player list and nametags.
team-display:
  enabled: true
  lobby: "<team_color><b><tag></b> "
  playing: "<team_color><b><tag></b> "
  spectating: "<gray>SPEC</gray> "

# The 25 cells of the card come from these tiers. Each tier lists the items
# it can draw from and how many cells it fills; the cells must add up to 25.
# Item keys are namespaced, plain names mean minecraft:. The plugin checks
