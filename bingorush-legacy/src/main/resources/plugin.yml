name: '${name}'
version: '${version}'
main: com.jifercraft.bingo.BingoRush
# 1.13 is the oldest value the field accepts; older servers ignore it.
api-version: '1.13'
author: JainaGam3r45
website: https://www.jifercraft.com
description: Bingo minigame for live events
softdepend: [PlaceholderAPI]

commands:
  bingo:
    description: Bingo minigame
    aliases: [b]
  card:
    description: Opens your bingo card
  teams:
    description: Opens the team menu

permissions:
  bingo.play:
    description: Lets the player join teams, open the card and use the lobby commands.
    default: true
  bingo.admin:
    description: Every admin command of BingoRush.
    default: op
    children:
      bingo.admin.round: true
      bingo.admin.arena: true
      bingo.admin.teams: true
      bingo.admin.history: true
      bingo.admin.reload: true
      bingo.admin.season: true
  bingo.admin.round:
    description: Start, stop, pause, resume and reroll rounds, and watch any team's card.
    default: op
  bingo.admin.arena:
    description: Create and edit arenas, waiting rooms, bingo signs and the lobby spawn.
    default: op
  bingo.admin.teams:
    description: Add, remove, fill and clear teams.
    default: op
  bingo.admin.history:
    description: Browse, export and clear the match history.
    default: op
  bingo.admin.reload:
    description: Reload config.yml, arenas.yml, presets.yml and the language files.
    default: op
  bingo.admin.season:
    description: Season status, phase tests, gifts and putting the lobby back.
    default: op
  bingo.update:
    description: Receives a notification when a new version is available.
    default: op
